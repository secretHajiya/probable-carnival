workflows:
  vyra-apk:
    name: Vyra Rewards Pro Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.vyrarewards.earn"
      node: 20.18.1
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install
      - name: Generate native Android project
        script: |
          set -e
          npx expo prebuild --platform android --clean
      - name: Force Kotlin 1.9.25 everywhere
        script: |
          set -e
          echo "Patching..."
          ls android/build.gradle
          # Patch build.gradle
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/build.gradle")
          txt=p.read_text()
          txt=txt.replace("1.9.24","1.9.25").replace("1.9.23","1.9.25")
          if "kotlinVersion" not in txt:
              txt=txt.replace("ext {", "ext {\n        kotlinVersion = \"1.9.25\"\n")
          p.write_text(txt)
          print("Patched android/build.gradle")
          PY
          # Patch gradle.properties
          echo "kotlinVersion=1.9.25" >> android/gradle.properties
          echo "kotlin.version=1.9.25" >> android/gradle.properties
          cat android/gradle.properties
          cat android/build.gradle | grep -n "kotlin" | head -20
          # Patch node_modules
          find node_modules/expo-modules-core -name "*.gradle" -exec sed -i "s/1.9.24/1.9.25/g" {} \; || true
          rm -f android/app/src/main/res/values/splash_colors.xml || true
      - name: Build Android debug APK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          cd android
          chmod +x gradlew
          ./gradlew --stop || true
          ./gradlew assembleDebug --no-daemon -PkotlinVersion=1.9.25 -Pkotlin.version=1.9.25 --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
