workflows:
  vyra-apk:
    name: Vyra Rewards Pro Final
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install
        script: npm install
      - name: Prebuild
        script: npx expo prebuild -p android --clean
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
