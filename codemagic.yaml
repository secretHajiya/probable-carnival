workflows:
  vyra-apk:
    name: Vyra APK Only
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean --non-interactive
      - name: Build APK Only
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
