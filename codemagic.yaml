workflows:
  vyra-apk:
    name: Vyra APK
    instance_type: linux
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17
    scripts:
      - name: Install deps
        script: npm install
      - name: Prebuild android
        script: npx expo prebuild --platform android --clean --non-interactive
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
