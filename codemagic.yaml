workflows:
  vyra-apk:
    name: Vyra APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17
    scripts:
      - name: Install
        script: npm install --legacy-peer-deps
      - name: Build APK
        script: |
          CI=1 npx expo prebuild --platform android --clean
          sed -i '' 's/<application/<application><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9958539812897899~1555530622"\/>/' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
