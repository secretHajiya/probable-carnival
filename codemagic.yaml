workflows:
  vyra-apk:
    name: Vyra Rewards Pro Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.vyrarewards.earn"
      node: 20.18.1
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install
      - name: Generate native Android project
        script: |
          set -e
          npx expo prebuild --platform android --clean
      - name: Fix Kotlin Version
        script: |
          set -e
          sed -i.bak "s/1.9.24/1.9.25/g" android/build.gradle
          rm -f android/app/src/main/res/values/splash_colors.xml
          if ! grep -q "splashscreen_background" android/app/src/main/res/values/colors.xml; then
            sed -i.bak "s|</resources>|    <color name=\"splashscreen_background\">#ffffff</color>\n</resources>|" android/app/src/main/res/values/colors.xml
          fi
      - name: Build Android debug APK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
