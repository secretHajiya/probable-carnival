workflows:
  vyra-apk:
    name: Vyra APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - npm install
      - npx expo prebuild --platform android --non-interactive
      - cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
